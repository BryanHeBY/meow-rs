name: Windows provider validation

on:
  push:
    branches: [ci/windows-provider-800d11c5]

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: KyleMayes/install-llvm-action@v2
        with:
          version: "18.1.8"
      - name: Verify toolchain
        run: |
          rustup show active-toolchain
          if (-not (Get-Command nasm -ErrorAction SilentlyContinue)) {
            choco install nasm --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Add-Content -Encoding utf8 -Path $env:GITHUB_PATH -Value 'C:\Program Files\NASM'
          }
      - name: Build exact core sources
        run: cargo build --locked -p meow-app -p meow-cli
      - name: Verify executable and transport tests
        run: |
          & .\target\debug\meow.exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p meow-config --lib internal_http
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: meow-800d11c5-windows-x64
          path: target/debug/meow.exe
          if-no-files-found: error
          retention-days: 3
